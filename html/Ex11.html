<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulari de validació HTML5</title>
</head>
<body>

    <h1>Formulari de registre</h1>

    <form>

        <label for="nom">Nom:</label>
        <input
            type="text"
            id="nom"
            name="nom"
            required
        >
        <br><br>

        <!-- Correu electrònic -->
        <label for="email">Correu electrònic:</label>
        <input
            type="email"
            id="email"
            name="email"
            required
        >
        <br><br>

        <label for="password">Contrasenya:</label>
        <input
            type="password"
            id="password"
            name="password"
            minlength="8"
            required
        >
        <br><br>

        
        <label for="telefon">Telèfon:</label>
        <input
            type="tel"
            id="telefon"
            name="telefon"
            pattern="[0-9]{9}"
            maxlength="9"
            required
            title="El telèfon ha de tenir exactament 9 dígits."
        >
        <br><br>

        <button type="submit">Enviar</button>

    </form>

</body>
</html>
