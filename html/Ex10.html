<!DOCTYPE html>
<html lang="cat">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Registre Típic</title>
        <meta name="description" content="Exercici 1">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="./css/style.css">
    </head>
    <body>
        <h1>Formulari de Registre</h1>

    <form action="#" method="post">
    
        <div>
            <label for="nom">Nom complet:</label><br>
            <input type="text" id="nom" name="nom" placeholder="Escriu el teu nom complet" required>
        </div>

        <br>

        <div>
            <label for="email">Correu electrònic:</label><br>
            <input type="email" id="email" name="email" placeholder="correu@exemple.com" required>
        </div>

        <br>

        <div>
            <label for="contrasenya">Contrasenya:</label><br>
            <input type="password" id="contrasenya" name="contrasenya" placeholder="Introdueix la teva contrasenya" required>
        </div>

        <br>

        <div>
            <input type="checkbox" id="termes" name="termes" required>
            <label for="termes">Accepto els termes i condicions</label>
        </div>

        <br>

        <button type="submit">Crear compte</button>

    </form>

    </body>
</html>
