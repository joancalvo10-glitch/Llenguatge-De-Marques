<!DOCTYPE html>
<html lang="cat">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Contacta'm</title>
        <meta name="description" content="Exercici 1">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="./css/style.css">
    </head>
    <body>
      <h1>Formulari de Contacte</h1>

    <form action="#" method="post">
        
        <div>
            <label for="nom">Nom:</label><br>
            <input type="text" id="nom" name="nom" placeholder="Escriu el teu nom" required>
        </div>

        <br>

        <div>
            <label for="email">Correu electrònic:</label><br>
            <input type="email" id="email" name="email" placeholder="Escriu el teu correu electrònic" required>
        </div>

        <br>

        <div>
            <label for="missatge">Missatge:</label><br>
            <textarea id="missatge" name="missatge" rows="5" cols="40" placeholder="Escriu aquí el teu missatge..." required></textarea>
        </div>

        <br>

        <button type="submit">Enviar missatge</button>

    </form>


    </body>
</html>
